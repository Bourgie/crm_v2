<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracias — FlexCRM</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
.card { background: #fff; border-radius: 16px; padding: 48px 40px; max-width: 420px; box-shadow: 0 4px 32px rgba(0,0,0,.06); border: 1px solid rgba(0,0,0,.06); }
.card h1 { font-size: 1.6rem; margin-bottom: 12px; }
.card p { font-size: .95rem; color: #64748b; line-height: 1.6; margin-bottom: 24px; }
.card a { display: inline-block; padding: 12px 28px; background: #6366f1; color: #fff; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: .95rem; transition: background .2s; }
.card a:hover { background: #4f46e5; }
</style>
</head>
<body>
<div class="card">
  <div style="font-size:48px;margin-bottom:16px" id="icon">✅</div>
  <h1 id="title">¡Gracias!</h1>
  <p id="message">Recibimos tu consulta. Te vamos a contactar en menos de 24 horas.</p>
  <a id="backLink" href="https://flexcrm.com.ar">Volver al inicio</a>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const from = params.get('from');
  const error = params.get('error');
  if (error) {
    document.getElementById('icon').textContent = '⚠️';
    document.getElementById('title').textContent = 'Ups';
    document.getElementById('message').textContent = 'Hubo un error al enviar tu consulta. Intentá de nuevo o escribinos por WhatsApp.';
  }
  if (from === 'unfulanodev') {
    document.getElementById('backLink').href = 'https://unfulanodev.com.ar';
  }
</script>
</body>
</html>
